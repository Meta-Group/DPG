name: Release

# The run-name appears in the Actions UI list and makes it obvious whether
# a run is just tests (PRs / pushes that aren't merges to main) or an
# actual release (push to main).  Without this, every run shows up as
# "Release" and it is hard to tell at a glance which ones published.
run-name: |
  ${{ github.event_name == 'pull_request' && format('🧪 Tests — PR #{0}', github.event.pull_request.number) || format('🚀 Release — {0} @ {1}', github.event.head_commit.id, github.ref_name) }}

on:
  # Only fires on push to main (i.e. when a PR is merged or a maintainer
  # pushes directly).  PR-time testing lives in the separate tests.yml
  # workflow so that opening a PR does NOT spawn a "Release" run in the
  # Actions UI — there is exactly one workflow run per release.
  push:
    branches:
      - main
    # The version-bump PR only changes pyproject.toml, so merging it must not
    # trigger another release.
    paths-ignore:
      - pyproject.toml

# Serialize runs — if two pushes hit main in quick succession, the second
# one waits instead of running in parallel and racing on tag creation /
# pyproject.toml edits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs only after a PR has been merged to main. Pull-request tests are
  # performed by tests.yml before merging and are intentionally not repeated.
  release:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      released: ${{ steps.version.outputs.SKIP == 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 2.4.0

      - name: Configure Poetry
        run: poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install

      # ---------------------------------------------------------------------------
      # Decide what version to publish.
      #
      # Rules (in order):
      #   1. If pyproject.toml's version is STRICTLY GREATER than the highest
      #      existing vX.Y.Z tag, treat it as a manual bump and use it as-is.
      #   2. Otherwise (no tags yet, or pyproject.toml <= highest tag), the
      #      maintainer did not change the version, so patch-bump it to the
      #      next patch above the highest released version.
      #   3. BUMPED=true only when we actually changed pyproject.toml.
      # ---------------------------------------------------------------------------
      - name: Determine version
        id: version
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          CUR_VERSION=$(poetry version --short)
          BUMPED=false

          git fetch --tags --quiet
          HIGHEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                          | sed 's/^v//' \
                          | sort -V \
                          | tail -n 1 || true)
          if [ -z "${HIGHEST_TAG:-}" ]; then
            HIGHEST_TAG="0.0.0"
          fi

          echo "CUR_VERSION=$CUR_VERSION"
          echo "HIGHEST_TAG=$HIGHEST_TAG"

          LARGEST=$(printf '%s\n%s\n' "$CUR_VERSION" "$HIGHEST_TAG" | sort -V | tail -n 1)

          if [ "$LARGEST" = "$CUR_VERSION" ] && [ "$CUR_VERSION" != "$HIGHEST_TAG" ]; then
            NEW_VERSION="$CUR_VERSION"
            echo "Manual bump detected ($CUR_VERSION > $HIGHEST_TAG). Using as-is."
          else
            poetry version "${HIGHEST_TAG}" >/dev/null
            poetry version patch >/dev/null
            NEW_VERSION=$(poetry version --short)
            # This persists in the checkout for the version-bump PR below.
            BUMPED=true
            echo "Auto-bumping from highest released $HIGHEST_TAG -> $NEW_VERSION (current pyproject: $CUR_VERSION)"
          fi

          echo "VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "PREV_VERSION=$CUR_VERSION" >> "$GITHUB_OUTPUT"
          echo "BUMPED=$BUMPED" >> "$GITHUB_OUTPUT"

          if git tag --list "v$NEW_VERSION" | grep -q .; then
            echo "Tag v$NEW_VERSION already exists. Skipping publish."
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.version.outputs.SKIP == 'false'
        id: publish
        run: poetry publish --build
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create tag
        if: steps.version.outputs.SKIP == 'false' && steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      - name: Create version bump pull request
        if: steps.version.outputs.SKIP == 'false' && steps.version.outputs.BUMPED == 'true' && steps.publish.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/bump-version-to-${{ steps.version.outputs.VERSION }}
          base: main
          delete-branch: true
          commit-message: "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          title: "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          body: |
            Updates the project version after publishing v${{ steps.version.outputs.VERSION }}.
          labels: automated
          add-paths: pyproject.toml

      # Build the versioned Sphinx docs as a GitHub Actions artifact so the
      # rendered HTML reflects this exact release (release/version are
      # passed via -D so they override docs/conf.py's defaults).
      # This does NOT modify any tracked file in the repo, so the workflow
      # does not re-trigger itself.
      #
      # The URL printed in the GitHub Release body still points at Read
      # the Docs (https://dpg.readthedocs.io/en/vX.Y.Z/).  That URL is
      # served by RTD independently and is unrelated to this artifact;
      # it will 404 unless the project's RTD automation rules activate
      # tags (Settings → Automation Rules on readthedocs.org).
      - name: Install system dependencies
        if: steps.version.outputs.SKIP == 'false' && steps.publish.outcome == 'success'
        run: sudo apt-get install -y graphviz

      - name: Install package + docs dependencies
        if: steps.version.outputs.SKIP == 'false' && steps.publish.outcome == 'success'
        run: pip install ".[docs]"

      - name: Build Sphinx docs
        if: steps.version.outputs.SKIP == 'false' && steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          MAJOR_MINOR=$(echo "$VERSION" | awk -F. '{print $1"."$2}')
          sphinx-build -b html \
            -D "release=${VERSION}" \
            -D "version=${MAJOR_MINOR}" \
            docs/ docs/_build/html 2>&1 | tee /tmp/sphinx_out.txt
          SPHINX_EXIT=${PIPESTATUS[0]}
          if [ "$SPHINX_EXIT" -ne 0 ]; then
            echo "Sphinx exited with code $SPHINX_EXIT"
            exit 1
          fi
          if grep -v "Unknown type: placeholder" /tmp/sphinx_out.txt | grep -q "^WARNING:"; then
            echo "Unexpected Sphinx warnings found:"
            grep -v "Unknown type: placeholder" /tmp/sphinx_out.txt | grep "^WARNING:"
            exit 1
          fi

      - name: Upload HTML docs as artifact
        if: steps.version.outputs.SKIP == 'false' && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html/
          retention-days: 7

      - name: Extract changelog from merged PR
        if: steps.version.outputs.SKIP == 'false'
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Parse the PR number from the merge commit message.
          # Supports both "Merge pull request #33 from ..." and squash merges
          # of the form "#33" or "(#33)" in the subject line.
          COMMIT_MSG=$(git log -1 --format=%s)
          PR_NUMBER=""
          if echo "$COMMIT_MSG" | grep -qE 'Merge pull request #[0-9]+'; then
            PR_NUMBER=$(echo "$COMMIT_MSG" | grep -oE '#[0-9]+' | head -n 1 | tr -d '#')
          elif echo "$COMMIT_MSG" | grep -qE '\(#([0-9]+)\)'; then
            PR_NUMBER=$(echo "$COMMIT_MSG" | grep -oE '\(#[0-9]+\)' | head -n 1 | grep -oE '[0-9]+')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number found in commit message (direct push?); skipping changelog."
            echo "changelog=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Fetching PR #$PR_NUMBER body..."
          PR_BODY=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                      --jq '.body // ""')

          if [ -z "$PR_BODY" ]; then
            echo "PR body is empty; skipping changelog."
            echo "changelog=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract the content under the '## Changelog' heading up to the
          # next '## ' heading or end-of-body.  Use awk (not python) to keep
          # this runnable on every Actions image without extra deps.
          CHANGELOG=$(printf '%s\n' "$PR_BODY" | awk '
            BEGIN { in_section = 0; buf = "" }
            # Detect the "## Changelog" heading (case-insensitive, allow
            # leading whitespace).  Skip to the next line and start capturing.
            /^[[:space:]]*##[[:space:]]*[Cc]hangelog[[:space:]]*$/ {
              in_section = 1
              next
            }
            in_section == 1 {
              # Stop on the next H2 (or shallower) heading.
              if ($0 ~ /^[[:space:]]*##[[:space:]]+/) {
                in_section = 0
              } else {
                buf = buf $0 "\n"
              }
            }
            END {
              # Trim trailing whitespace from the buffer.
              sub(/[[:space:]]+$/, "", buf)
              print buf
            }
          ')

          # Older PRs may predate the template or omit its heading. Preserve
          # their meaningful PR body rather than dropping release notes.
          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ]; then
            CHANGELOG="$PR_BODY"
          fi

          # Strip the HTML comment block that the PR template ships with,
          # so release notes don't include the instructions to contributors.
          CHANGELOG=$(printf '%s\n' "$CHANGELOG" | sed '/<!--/,/-->/d')

          # Trim leading/trailing blank lines.
          CHANGELOG=$(printf '%s\n' "$CHANGELOG" | sed '1{/^$/d}; ${/^$/d}')

          # If nothing remains after stripping, don't emit a header.
          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ]; then
            echo "PR body had no usable changelog content; skipping."
            echo "changelog=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "changelog<<EOF"
            printf '%s\n' "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.SKIP == 'false'
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.changelog }}
            Docs: https://dpg.readthedocs.io/en/v${{ steps.version.outputs.VERSION }}/
            PyPI: https://pypi.org/project/dpg/${{ steps.version.outputs.VERSION }}/

  # ---------------------------------------------------------------------------
  # 2) NOTIFY
  #    Single Telegram message at the very end with the outcome of every
  #    job.  Always runs (if: always()) so failures and skipped releases
  #    are reported too.
  #
  #    Only fires on push to main — PRs do not trigger a notify.
  # ---------------------------------------------------------------------------
  notify:
    name: Telegram notification
    needs: release
    # Only send Telegram on full success.  Failures are surfaced via
    # GitHub's built-in Actions email notification, so no Telegram is
    # needed (and would be noisy) on failure.
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build and send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          AUTHOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_RESULT: ${{ needs.release.result }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASED: ${{ needs.release.outputs.released }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(printf '%s' "${COMMIT_SHA}" | cut -c1-7)"

          # Per-job status icons.
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⚠️" ;;
              skipped) echo "⏭️" ;;
              *)        echo "❔" ;;
            esac
          }

          RELEASE_ICON=$(status_icon "${RELEASE_RESULT}")

          # Overall outcome of the workflow.
          if [ "${RELEASE_RESULT}" = "success" ]; then
            OUTCOME="✅ SUCCESS"
          else
            OUTCOME="⚠️ ${RELEASE_RESULT^^}"
          fi

          # Build the body with literal '\n' sequences (NOT real newlines)
          # so we never break out of this YAML block scalar.  Telegram
          # accepts %0A as the newline marker.
          NL=$'\n'

          RELEASE_LINE=""
          if [ "${RELEASED}" = "true" ] && [ -n "${VERSION}" ]; then
            HASH=$(printf '\043')
            RELEASE_URL="${RUN_URL}${HASH}releases"
            RELEASE_LINE="📦 Version: ${VERSION}${NL}🔗 Release: ${RELEASE_URL}"
          elif [ "${VERSION}" = "" ]; then
            RELEASE_LINE="📦 Version: (could not be determined)"
          fi

          BODY="${OUTCOME} on ${REPOSITORY}${NL}👤 Author: ${AUTHOR}${NL}🔖 Commit: ${SHORT_SHA}${NL}💬 Message: ${COMMIT_MESSAGE}${NL}${NL}${RELEASE_ICON} Release${NL}${RELEASE_LINE}${NL}${NL}🔍 Run: ${RUN_URL}"

          # Replace real newlines with Telegram's %0A marker.
          TEXT=$(printf '%s' "$BODY" | sed ':a;N;$!ba;s/\n/%0A/g')

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true"