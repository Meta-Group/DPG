name: Tests

# Runs pytest on every PR and on every push to main.  Lives in its own
# workflow so the release pipeline (release.yml) is only triggered on
# push to main — keeping the Actions UI clean: exactly one Release run
# per merge, plus zero-or-more Test runs depending on PR activity.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -q